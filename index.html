<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

.sky {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 420px;
  overflow: hidden;
}

.drakosha {
  position: absolute;
  width: 230px;
  max-width: 32vw;
  left: -260px;
  top: 38%;
  animation: fly 12s linear infinite;
  filter: drop-shadow(0 0 12px #d75cff);
}

@keyframes fly {
  0% {
    left: -260px;
    top: 55%;
    transform: rotate(-5deg);
  }

  25% {
    top: 15%;
    transform: rotate(7deg);
  }

  50% {
    top: 45%;
    transform: rotate(-4deg);
  }

  75% {
    top: 20%;
    transform: rotate(6deg);
  }

  100% {
    left: 110%;
    top: 50%;
    transform: rotate(-5deg);
  }
}
</style>
</head>

<body>

<div class="sky">
  <img class="drakosha"
       id="drakosha"
       src="D-1.png"
       alt="Дракоша А-7">
</div>

<script>
const drakosha = document.getElementById("drakosha");

const frames = [
  "D-9.png",
  "D-3.png",
  "D-6.png",
  "D-2.png",
  "D-2.png",
  "D-5.png",
  "D-1.png",
  "D-4.png",
  "D-7.png",
  "D-6.png",
  "D-3.png",
  "D-5.png",
  "D-1.png",
  "D-7.png",
  "D-2.png",
  "D-5.png"
];

let frame = 0;

setInterval(() => {
  frame = (frame + 1) % frames.length;
  drakosha.src = frames[frame];
}, 120);

</script>

</body>
</html>
